name: vm-baremetal-sushy

topology:
  nodes:
    bmh1:
      kind: linux
      image: vrnetlab/baremetal-sushy:latest
      runtime: docker
      network-mode: none
      labels:
        containerlab: baremetal-sushy
      binds:
        - /home/kka/github.com/karampok/telco-ocp-lab/share/hub/agent.x86_64.iso:/cdrom/x.iso:ro
        - /dev/kvm:/dev/kvm
      ports:
        - "5900:5900"  # VNC: remote-viewer vnc://localhost:5900
        - "8000:8000"  # Redfish API: http://localhost:8000/redfish/v1/
      env:
        QEMU_DISK_SIZE: "50G"
        QEMU_MEMORY: "8192"
        VCPU: "4"
      exec:
        - ip addr add 172.20.0.2/24 dev bmc
        - ip link set bmc up
        - ip route add default via 172.20.0.1
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
    gw:
      kind: linux
      image: quay.io/karampok/snife:latest
      network-mode: none
      stages:
        create-links:
          exec:
            - command: ip addr add 10.0.99.1/30 dev gw-upstream
              target: host
              phase: on-exit
            - command: ip route add 172.20.0.0/24 via 10.0.99.2
              target: host
              phase: on-exit
            # nft rules applied from clab.nft:
            # table inet clab
            # delete table inet clab
            # table inet clab {
            #   chain forward { type filter hook forward priority -1; policy accept;
            #     iifname "gw-upstream" accept;
            #     oifname "gw-upstream" ct state related,established accept; }
            #   chain postrouting { type nat hook postrouting priority 99;
            #     ip saddr 10.0.99.0/30 oifname != "gw-upstream" masquerade; }
            # }
            # table ip filter {
            #   chain FORWARD {
            #     iifname "gw-upstream" accept comment "containerlab-custom";
            #     oifname "gw-upstream" ct state related,established accept comment "containerlab-custom"; } }
            - command: nft -f /home/kka/github.com/srl-labs/vrnetlab/baremetal/config/clab.nft
              target: host
              phase: on-exit
      exec:
        - ip addr add 172.20.0.1/24 dev eth1
        - ip addr add 10.0.99.2/30 dev upstream
        - ip route add default via 10.0.99.1
        - nft add table inet nat
        - nft add chain inet nat postrouting '{ type nat hook postrouting priority srcnat; }'
        - nft add rule inet nat postrouting oifname "upstream" masquerade
    dhcp:
      kind: linux
      image: quay.io/karampok/tools:dnsmasq
      network-mode: container:gw
      binds:
        - ../baremetal/config/dnsmasq/dnsmasq.conf:/opt/dnsmasq/dnsmasq.conf
      entrypoint: dnsmasq -d --conf-file=/opt/dnsmasq/dnsmasq.conf
    sw:
      kind: linux
      image: quay.io/karampok/snife:latest
      network-mode: none
      exec:
        - ip link add br0 type bridge
        - ip link set eth0 master br0
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set br0 up

  links:
    - endpoints: ["bmh1:bmc", "sw:eth0"]
    - endpoints: ["bmh1:net", "sw:eth2"]
    - endpoints: ["bmh1:eth10", "sw:eth3"]
    - endpoints: ["gw:eth1", "sw:eth1"]
    - endpoints: ["gw:upstream", "host:gw-upstream"]
