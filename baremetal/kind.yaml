kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controlPlaneEndpoint: "172.20.0.10:6443"
    apiServer:
      extraArgs:
        bind-address: "0.0.0.0"
      certSANs:
      - "172.20.0.10"
  - |
    kind: InitConfiguration
    localAPIEndpoint:
      advertiseAddress: "172.20.0.10"
      bindPort: 6443
    nodeRegistration:
      kubeletExtraArgs:
        node-ip: "172.20.0.10"
